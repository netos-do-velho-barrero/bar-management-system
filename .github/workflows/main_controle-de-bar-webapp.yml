# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - controle-de-bar-webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Install Playwright Chromium
        shell: pwsh
        run: tests/ControleDeBar.Testes.E2E/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run tests
        run: |
          dotnet test tests/ControleDeBar.Testes.Unidade/ControleDeBar.Testes.Unidade.csproj --configuration Release --no-build
          dotnet test tests/ControleDeBar.Testes.Integracao/ControleDeBar.Testes.Integracao.csproj --configuration Release --no-build
          dotnet test tests/ControleDeBar.Testes.E2E/ControleDeBar.Testes.E2E.csproj `
            --configuration Release `
            --no-build `
            --settings tests/ControleDeBar.Testes.E2E/playwright.runsettings

      - name: dotnet publish
        run: dotnet publish src/ControleDeBar.WebApp/ControleDeBar.WebApp.csproj -c Release -r win-x86 --self-contained false -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore src/ControleDeBar.WebApp/ControleDeBar.WebApp.csproj

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply ORM migrations to AzureSQL
        env:
          AZURESQL_CONNECTION_STRING: ${{ secrets.AZURESQL_CONNECTION_STRING }}
          Infra__NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: |
          dotnet ef database update `
            --project src/ControleDeBar.Infra/ControleDeBar.Infra.csproj `
            --startup-project src/ControleDeBar.WebApp/ControleDeBar.WebApp.csproj `
            --configuration Release `
            --connection "$env:AZURESQL_CONNECTION_STRING"

  deploy:
    runs-on: windows-latest
    needs: [build-and-test, migrate]
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_59BA4E193D4D4736A9C8229715209895 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_511870ABB15F4C11A3405BCEDF344BF2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE4E605AAAC849FFAA67B5083F47DE4A }}

      - name: Configure Azure Web App settings
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group "controle-de-bar" `
            --name "controle-de-bar-webapp" `
            --settings `
            "ConnectionStrings__SqlServerEF=${{ secrets.AZURESQL_CONNECTION_STRING }}" `
            "Infra__NewRelic__LicenseKey=${{ secrets.NEWRELIC_LICENSE_KEY }}" `
            "Apresentacao__AutoMapper__LicenseKey=${{ secrets.AUTOMAPPER_LICENSE_KEY }}" `
            "WEBSITE_RUN_FROM_PACKAGE=1"

      - name: Wait for App Service to stabilize
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'controle-de-bar-webapp'
          slot-name: 'Production'
          package: .
